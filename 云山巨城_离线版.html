<html lang="zh-CN">
<head>

  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'">
  <title>云山巨城 · 可游览的体素山水长卷</title>
  <style>
    :root{font-family:"Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:#fff7e8;--glass:rgba(13,28,36,.67);--line:rgba(255,240,209,.19);--gold:#ead3a2}

    #brand .eyebrow{font-size:10px;letter-spacing:.32em;color:#dbc89e}h1{margin:8px 0 7px;font-family:"STKaiti","KaiTi","Songti SC",serif;font-weight:600;font-size:34px;letter-spacing:.16em;line-height:1.1;text-shadow:0 2px 12px #15242a}#brand p{font-size:11px;line-height:1.55;letter-spacing:.1em;color:#d5e0df;margin:0}
