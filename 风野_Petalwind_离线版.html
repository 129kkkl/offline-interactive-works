#root {
  width: 100%;
  height: 100%;
}

#offline-error {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 15%, #75af91, #173c34 72%);
  color: #fff9e9;
  font-family: "Microsoft YaHei", system-ui, sans-serif;
}

#offline-error[hidden] {
  display: none;
}

.offline-error-card {
  width: min(520px, 100%);
  padding: 34px;
  border: 1px solid rgba(255, 255, 255, .2);
  border-radius: 24px;
  background: rgba(15, 48, 40, .55);
  box-shadow: 0 24px 80px rgba(5, 25, 20, .35);
  backdrop-filter: blur(18px);
}

.offline-error-card h1 {
  margin: 6px 0 14px;
  font: 400 34px/1.2 Georgia, "Songti SC", serif;
  letter-spacing: .12em;
}

.offline-error-card p {
  margin: 0;
  line-height: 1.9;
  color: rgba(255, 255, 255, .78);
}

.offline-error-kicker {
  font-size: 10px;
  letter-spacing: .28em;
}

#offline-error-detail {
  display: block;
  margin-top: 18px;
  padding: 12px;
  overflow-wrap: anywhere;
  border-radius: 10px;
  background: rgba(0, 0, 0, .2);
  color: #ffd6c9;
  font-size: 11px;
}

.offline-noscript {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: #173c34;
  color: #fff9e9;
  font: 16px/1.8 "Microsoft YaHei", sans-serif;
  text-align: center;
}

  </style>
</head>
<body>
  <div id="root" aria-live="polite"></div>
  <section id="offline-error" hidden role="alert" aria-live="assertive">
    <div class="offline-error-card">
      <p class="offline-error-kicker">PETALWIND · OFFLINE</p>
      <h1>风暂时停下了</h1>
      <p>这台设备未能启动 3D 画面。请确认浏览器已开启硬件加速，然后重新打开文件。</p>
      <code id="offline-error-detail"></code>
    </div>
  </section>
  <noscript>
    <section class="offline-noscript">请在浏览器设置中启用 JavaScript，然后重新打开《风野》。</section>
  </noscript>
