<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>暮港箱庭 · Hearthwick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f4efe6;
      --muted: rgba(244, 239, 230, 0.62);
      --glass: rgba(12, 16, 24, 0.42);
      --line: rgba(244, 239, 230, 0.16);
      --accent: #e8b86d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      font-family: Outfit, "Noto Serif SC", sans-serif;
      color: var(--ink);
    }
    .panel {
      pointer-events: auto;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    header.brand {
      position: absolute; top: 28px; left: 28px;
      padding: 16px 20px 14px;
      border-radius: 16px;
      max-width: min(420px, calc(100vw - 56px));
    }
    header.brand .kicker {
      font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--accent); font-weight: 600;
    }
    header.brand h1 {
      font-family: "Noto Serif SC", serif;
      font-size: 28px; line-height: 1.2; margin: 6px 0 4px; font-weight: 700;
    }
    header.brand p { font-size: 13px; color: var(--muted); line-height: 1.55; }
    .controls {
      position: absolute; top: 28px; right: 28px;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    button {
      pointer-events: auto; cursor: pointer;
      border: 1px solid var(--line); background: var(--glass);
      color: var(--ink); font-family: Outfit, sans-serif;
      font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
      padding: 10px 16px; border-radius: 999px;
      backdrop-filter: blur(16px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }
    button:hover { transform: translateY(-1px); border-color: rgba(232, 184, 109, 0.55); }
    button.active { background: rgba(232, 184, 109, 0.22); border-color: var(--accent); color: #fff6e8; }
    .spots {
      position: absolute; left: 28px; bottom: 28px;
      display: flex; flex-wrap: wrap; gap: 8px; max-width: 70vw;
    }
    .spots button { padding: 8px 14px; font-size: 12px; }
    .hint {
      position: absolute; right: 28px; bottom: 28px;
      font-size: 12px; color: var(--muted); text-align: right; line-height: 1.6;
      padding: 12px 16px; border-radius: 14px;
    }
    .clock {
      font-variant-numeric: tabular-nums;
      color: var(--accent); font-weight: 600; font-size: 13px; margin-top: 8px;
    }
    @media (max-width: 720px) {
      header.brand { top: 14px; left: 14px; padding: 12px 14px; }
      header.brand h1 { font-size: 22px; }
      .controls { top: 14px; right: 14px; }
      .spots { left: 14px; bottom: 14px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <header class="brand panel">
      <div class="kicker">Diorama · 003</div>
      <h1>暮港箱庭</h1>
      <p>一座依山临水的微缩港镇。台地错落，屋顶各异，昼夜缓缓交替。</p>
      <div class="clock" id="tod">午后 · 黄金时刻</div>
    </header>
    <div class="controls">
      <button id="btnDay" class="active">白昼</button>
      <button id="btnNight">夜晚</button>
      <button id="btnAuto">自动循环</button>
      <button id="btnReset">回到全景</button>
    </div>
    <div class="spots">
      <button data-spot="plaza">喷泉广场</button>
      <button data-spot="harbor">暮港码头</button>
      <button data-spot="mill">山脊风车</button>
      <button data-spot="church">钟楼教堂</button>
      <button data-spot="keep">高堡庄园</button>
    </div>
    <div class="hint panel">拖拽旋转 · 滚轮缩放 · 右键平移</div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const seedRng = (s) => () => {
  s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
const rand = seedRng(20260821);
const rrange = (a, b) => a + rand() * (b - a);
const rpick = (arr) => arr[Math.floor(rand() * arr.length)];
const hash = (x, z) => {
  const n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return n - Math.floor(n);
};
const noise = (x, z) => {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
};
const fbm = (x, z) => {
  let v = 0, a = 0.5, f = 1, s = 0;
  for (let i = 0; i < 4; i++) { v += noise(x * f, z * f) * a; s += a; a *= 0.5; f *= 2; }
  return v / s;
};
const smooth = THREE.MathUtils.smoothstep;

function groundH(x, z) {
  let h = 0;
  h += smooth(-9, 11, x) * 1.55;
  h += smooth(7.5, -9, z) * 2.9;
  h += Math.exp(-((x - 8.2) ** 2 + (z - 3.6) ** 2) / 7.5) * 1.85;
  h += Math.exp(-((x - 7.4) ** 2 + (z + 6.2) ** 2) / 11) * 2.45;
  h += Math.exp(-((x - 1.2) ** 2 + (z + 1.4) ** 2) / 18) * 0.55;
  h -= Math.exp(-((x + 7.4) ** 2) / 5.8) * (1.15 + 0.25 * Math.cos(z * 0.45));
  h -= Math.exp(-((x + 6.8) ** 2 + (z - 5.6) ** 2) / 6.5) * 0.7;
  h += (fbm(x * 0.18, z * 0.18) - 0.5) * 0.42;
  return Math.max(0.02, h);
}

const PAL = {
  grassA: 0x4f7d3e, grassB: 0x6a9652, grassC: 0x3d6a38,
  dirt: 0x6b5340, stone: 0x8d857c, stone2: 0x6f6860, cobble: 0x9a9186,
  wood: 0x6a4530, wood2: 0x8a5a3a, darkWood: 0x3c2416, plinth: 0x2c1b10,
  cream: 0xe6d7c3, peach: 0xd4a574, terracotta: 0xc4785a, sage: 0x8a9a78,
  slateWall: 0x7a8490, blush: 0xd9b7a3, linen: 0xf0e6d4, mustard: 0xc4a35a,
  roofTerra: 0xb85c38, roofSlate: 0x3f4a55, roofMoss: 0x3d6b4f, roofBrown: 0x5c4033,
  roofBlue: 0x4a6580, water: 0x3a7ca5, sand: 0xcbb892, hedge: 0x2f5a32,
  leafA: 0x3f7a3a, leafB: 0x5c8f3e, leafC: 0x2e5c32, leafD: 0x7a9a45,
  gold: 0xe8b86d, iron: 0x3a3a42, brick: 0x9a5a48
};

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87c4e0, 0.012);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
const camTarget = new THREE.Vector3(0.4, 1.6, 0.2);
const spherical = new THREE.Spherical(22.5, 0.98, 0.72);
let sphericalGoal = spherical.clone();
let targetGoal = camTarget.clone();
let dragging = false, panning = false, lastX = 0, lastY = 0;
let userDriving = false, userTimer = 0;

function applyCam() {
  camera.position.setFromSpherical(spherical).add(camTarget);
  camera.lookAt(camTarget);
}
applyCam();

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  lastX = e.clientX; lastY = e.clientY;
  panning = e.button === 2 || e.shiftKey;
  dragging = true; userDriving = true; userTimer = 0;
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (panning) {
    const pan = 0.012 * spherical.radius / 20;
    const right = new THREE.Vector3();
    const up = new THREE.Vector3();
    camera.getWorldDirection(right);
    right.cross(camera.up).normalize();
    up.copy(camera.up).normalize();
    camTarget.addScaledVector(right, -dx * pan);
    camTarget.addScaledVector(up, dy * pan);
    targetGoal.copy(camTarget);
  } else {
    sphericalGoal.theta -= dx * 0.005;
    sphericalGoal.phi = THREE.MathUtils.clamp(sphericalGoal.phi + dy * 0.004, 0.28, 1.28);
  }
});
canvas.addEventListener('pointerup', () => { dragging = false; panning = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  userDriving = true; userTimer = 0;
  sphericalGoal.radius = THREE.MathUtils.clamp(sphericalGoal.radius + e.deltaY * 0.012, 7, 38);
}, { passive: false });

const world = new THREE.Group();
scene.add(world);
const anim = { mill: null, wheel: null, flags: [], smoke: [], birds: [], boats: [], train: null, clockMin: null, clockHour: null, clouds: [], trees: [], fireflies: null, fountain: [], waterfall: null, people: [], road: null };
const windowsLit = [];
const lamps = [];
const pointLights = [];

function mat(color, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.84, metalness: 0.03, ...extra });
}
const geoCache = new Map();
function gBox(w, h, d) {
  const k = `b${w}_${h}_${d}`;
  if (!geoCache.has(k)) geoCache.set(k, new THREE.BoxGeometry(w, h, d));
  return geoCache.get(k);
}
function mesh(geo, material, x, y, z, parent = world, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  parent.add(m);
  return m;
}
function box(w, h, d, color, x, y, z, parent = world, extra = {}) {
  return mesh(gBox(w, h, d), extra.mat || mat(color, extra), x, y, z, parent, extra.shadow !== false);
}

function gableRoof(w, h, d, color, parent, x, y, z, rotY = 0) {
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0); shape.lineTo(w / 2, 0); shape.lineTo(0, h); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
  geo.translate(0, 0, -d / 2);
  const m = new THREE.Mesh(geo, mat(color, { roughness: 0.72 }));
  m.position.set(x, y, z); m.rotation.y = rotY;
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function hipRoof(w, h, d, color, parent, x, y, z) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(0.72, 1, 4), mat(color, { roughness: 0.7 }));
  m.rotation.y = Math.PI / 4;
  m.scale.set(w * 0.92, h, d * 0.92);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true; parent.add(m); return m;
}
function coneRoof(r, h, color, parent, x, y, z, seg = 8) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), mat(color, { roughness: 0.68 }));
  m.position.set(x, y + h / 2, z); m.castShadow = true; parent.add(m); return m;
}

const winMat = mat(0x8ec4d4, { roughness: 0.25, metalness: 0.15, emissive: 0xffc978, emissiveIntensity: 0 });
const winDark = mat(0x2a3340, { roughness: 0.35, metalness: 0.1, emissive: 0x0a0c12, emissiveIntensity: 0.1 });
const lampMat = mat(0xffe7b0, { roughness: 0.3, emissive: 0xffd89a, emissiveIntensity: 0.15 });

function addWindow(parent, x, y, z, w = 0.18, h = 0.22, lit = true) {
  const m = mesh(gBox(w, h, 0.04), lit ? winMat : winDark, x, y, z, parent, false);
  if (lit) windowsLit.push(m);
  return m;
}
function facadeWindows(parent, w, stories, d, wallH, baseY, density = 0.72) {
  const cols = Math.max(2, Math.round(w / 0.55));
  for (let s = 0; s < stories; s++) {
    const wy = baseY + 0.28 + s * (wallH / stories);
    for (let c = 0; c < cols; c++) {
      const wx = -w / 2 + (c + 0.5) * (w / cols);
      const lit = rand() < density;
      addWindow(parent, wx, wy, d / 2 + 0.021, 0.16, 0.2, lit);
      if (rand() > 0.35) addWindow(parent, wx, wy, -d / 2 - 0.021, 0.16, 0.2, rand() < density);
    }
  }
}

function addHouse(opts) {
  const {
    x, z, w = 1.45, d = 1.15, stories = 2, wall = PAL.cream, roof = PAL.roofTerra,
    style = 'gable', rot = 0, chimney = true, shop = false, wing = false, y
  } = opts;
  const g = new THREE.Group();
  const gy = y == null ? groundH(x, z) : y;
  g.position.set(x, gy, z);
  g.rotation.y = rot;
  const wallH = 0.52 * stories + 0.08;
  box(w + 0.1, 0.14, d + 0.1, PAL.stone, 0, 0.07, 0, g);
  box(w, wallH, d, wall, 0, 0.14 + wallH / 2, 0, g);
  box(0.22, 0.38, 0.06, PAL.wood2, 0.18, 0.14 + 0.2, d / 2 + 0.03, g);
  facadeWindows(g, w * 0.92, stories, d, wallH, 0.14, shop ? 0.85 : 0.7);
  if (shop) {
    const awn = box(w * 0.92, 0.04, 0.42, rpick([PAL.mustard, PAL.terracotta, 0x3a6ea5, 0xa8453c]), 0, 0.14 + 0.55, d / 2 + 0.22, g);
    awn.rotation.x = -0.18;
    box(0.42, 0.28, 0.05, 0x1c1a18, 0, 0.14 + 0.78, d / 2 + 0.04, g);
  }
  const roofY = 0.14 + wallH;
  if (style === 'hip') hipRoof(w + 0.12, 0.55 + stories * 0.08, d + 0.12, roof, g, 0, roofY, 0);
  else if (style === 'cone') coneRoof(Math.max(w, d) * 0.42, 0.85, roof, g, 0, roofY, 0, 7);
  else gableRoof(w + 0.16, 0.55 + stories * 0.1, d + 0.08, roof, g, 0, roofY, 0, rand() > 0.5 ? 0 : Math.PI / 2);
  if (chimney && rand() > 0.25) {
    const cx = rrange(-w * 0.25, w * 0.25);
    box(0.16, 0.42, 0.16, PAL.brick, cx, roofY + 0.45, -d * 0.15, g);
    box(0.2, 0.05, 0.2, PAL.stone2, cx, roofY + 0.66, -d * 0.15, g);
    if (rand() > 0.4) anim.smoke.push(makeSmoke(g, cx, roofY + 0.72, -d * 0.15));
  }
  if (wing) {
    const ww = w * 0.62, wd = d * 0.72, wh = wallH * 0.78;
    box(ww, wh, wd, wall, w * 0.42, 0.14 + wh / 2, d * 0.42, g);
    gableRoof(ww + 0.1, 0.42, wd + 0.06, roof, g, w * 0.42, 0.14 + wh, d * 0.42);
    addWindow(g, w * 0.42, 0.14 + 0.36, d * 0.42 + wd / 2 + 0.02);
  }
  if (rand() > 0.55) {
    box(0.34, 0.08, 0.16, PAL.wood, -w * 0.28, 0.14 + wallH * 0.55, d / 2 + 0.1, g);
    const fl = mesh(new THREE.BoxGeometry(0.02, 0.22, 0.18), mat(0xb8453c), -w * 0.28, 0.14 + wallH * 0.72, d / 2 + 0.16, g, false);
    anim.flags.push({ mesh: fl, phase: rand() * 6, amp: 0.25 });
  }
  world.add(g);
  return g;
}

function makeSmoke(parent, x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  const puffs = [];
  for (let i = 0; i < 4; i++) {
    const s = mesh(new THREE.SphereGeometry(0.09, 6, 6), mat(0xc8c4be, { transparent: true, opacity: 0.28, roughness: 1 }), 0, i * 0.12, 0, g, false);
    puffs.push({ mesh: s, t: rand() * 2, speed: rrange(0.18, 0.32) });
  }
  parent.add(g);
  return { group: g, puffs };
}

function addTree(x, z, scale = 1, kind = 'round') {
  const g = new THREE.Group();
  const y = groundH(x, z);
  g.position.set(x, y, z);
  const th = 0.55 * scale, tr = 0.07 * scale;
  mesh(new THREE.CylinderGeometry(tr * 0.7, tr, th, 6), mat(PAL.wood), 0, th / 2, 0, g);
  const leaf = rpick([PAL.leafA, PAL.leafB, PAL.leafC, PAL.leafD]);
  if (kind === 'cone') {
    mesh(new THREE.ConeGeometry(0.42 * scale, 1.15 * scale, 7), mat(leaf, { roughness: 0.9 }), 0, th + 0.45 * scale, 0, g);
    mesh(new THREE.ConeGeometry(0.32 * scale, 0.7 * scale, 7), mat(leaf), 0, th + 0.95 * scale, 0, g);
  } else {
    const n = 3 + Math.floor(rand() * 3);
    for (let i = 0; i < n; i++) {
      const rs = (0.32 + rand() * 0.22) * scale;
      mesh(new THREE.SphereGeometry(rs, 8, 6), mat(leaf, { roughness: 0.92 }), rrange(-0.18, 0.18) * scale, th + 0.28 * scale + i * 0.12 * scale, rrange(-0.18, 0.18) * scale, g);
    }
  }
  world.add(g);
  anim.trees.push({ g, phase: rand() * 6, amp: 0.04 + rand() * 0.03 });
  return g;
}

function addLamp(x, z, h = 1.15) {
  const g = new THREE.Group();
  const y = groundH(x, z);
  g.position.set(x, y, z);
  mesh(new THREE.CylinderGeometry(0.04, 0.05, h, 6), mat(PAL.iron), 0, h / 2, 0, g);
  mesh(new THREE.SphereGeometry(0.09, 8, 8), lampMat, 0, h + 0.02, 0, g, false);
  const pl = new THREE.PointLight(0xffc07a, 0, 6.5, 2);
  pl.position.set(0, h + 0.05, 0);
  g.add(pl);
  pointLights.push(pl);
  lamps.push(g);
  world.add(g);
}

function addBush(x, z, s = 0.35) {
  const y = groundH(x, z);
  mesh(new THREE.SphereGeometry(s, 7, 5), mat(PAL.hedge, { roughness: 0.95 }), x, y + s * 0.7, z);
}

/* -------------------- sky -------------------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uNight: { value: 0 } },
  vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uNight; varying vec3 vPos;
    void main(){
      float h = normalize(vPos).y;
      vec3 dayZ = vec3(0.42, 0.70, 0.92);
      vec3 dayH = vec3(0.96, 0.86, 0.68);
      vec3 nightZ = vec3(0.025, 0.04, 0.10);
      vec3 nightH = vec3(0.14, 0.10, 0.22);
      vec3 day = mix(dayH, dayZ, smoothstep(-0.2, 0.62, h));
      vec3 night = mix(nightH, nightZ, smoothstep(-0.12, 0.7, h));
      gl_FragColor = vec4(mix(day, night, uNight), 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(90, 24, 16), skyMat));

const starGeo = new THREE.BufferGeometry();
const starN = 420;
const starPos = new Float32Array(starN * 3);
for (let i = 0; i < starN; i++) {
  const th = rand() * Math.PI * 2;
  const ph = 0.15 + rand() * 1.1;
  const r = 70;
  starPos[i * 3] = r * Math.sin(ph) * Math.cos(th);
  starPos[i * 3 + 1] = r * Math.cos(ph) * 0.55 + 18;
  starPos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xefe8d8, size: 0.18, transparent: true, opacity: 0, depthWrite: false }));
scene.add(stars);

const sun = mesh(new THREE.SphereGeometry(1.1, 16, 16), mat(0xffe7a8, { emissive: 0xffd27a, emissiveIntensity: 1.2, roughness: 1 }), 18, 16, 8, scene, false);
const moon = mesh(new THREE.SphereGeometry(0.7, 12, 12), mat(0xdde6f5, { emissive: 0x9bb0d0, emissiveIntensity: 0.4, roughness: 1 }), -16, 14, -6, scene, false);

const hemi = new THREE.HemisphereLight(0xc5e0ff, 0x3d2a18, 0.72);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff1d0, 1.35);
sunLight.position.set(14, 18, 9);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -18; sunLight.shadow.camera.right = 18;
sunLight.shadow.camera.top = 16; sunLight.shadow.camera.bottom = -16;
sunLight.shadow.camera.near = 4; sunLight.shadow.camera.far = 50;

(function terrain() {
  const geo = new THREE.PlaneGeometry(28.4, 20.4, 70, 50);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const cA = new THREE.Color(PAL.grassA), cB = new THREE.Color(PAL.grassB), cC = new THREE.Color(PAL.dirt), cS = new THREE.Color(PAL.sand);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let y = groundH(x, z);
    if (Math.abs(x) > 13.6 || Math.abs(z) > 9.7) y *= 0.15;
    pos.setY(i, y);
    const river = Math.exp(-((x + 7.4) ** 2) / 5.5);
    const slope = Math.max(0, y);
    tmp.copy(cA).lerp(cB, noise(x * 0.4, z * 0.4));
    if (river > 0.35 && y < 0.55) tmp.lerp(cS, (river - 0.35) * 1.4);
    if (slope > 3.2) tmp.lerp(new THREE.Color(PAL.stone), smooth(3.2, 5.2, slope) * 0.55);
    if (y < 0.2) tmp.lerp(cC, 0.35);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
  ground.receiveShadow = true;
  world.add(ground);

  function terrace(cx, cz, w, d, lift = 0.18) {
    const g = new THREE.Group();
    const y = groundH(cx, cz);
    g.position.set(cx, y, cz);
    const shape = new THREE.Shape();
    const hw = w / 2, hd = d / 2, r = Math.min(0.55, w, d) * 0.18;
    shape.moveTo(-hw + r, -hd);
    shape.lineTo(hw - r, -hd); shape.quadraticCurveTo(hw, -hd, hw, -hd + r);
    shape.lineTo(hw, hd - r); shape.quadraticCurveTo(hw, hd, hw - r, hd);
    shape.lineTo(-hw + r, hd); shape.quadraticCurveTo(-hw, hd, -hw, hd - r);
    shape.lineTo(-hw, -hd + r); shape.quadraticCurveTo(-hw, -hd, -hw + r, -hd);
    const plat = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: lift, bevelEnabled: false }), mat(PAL.stone, { roughness: 0.88 }));
    plat.rotation.x = -Math.PI / 2; plat.position.y = 0.02;
    plat.castShadow = true; plat.receiveShadow = true; g.add(plat);
    world.add(g);
    return y + lift;
  }
  terrace(0.2, 2.4, 5.6, 4.4, 0.16);
  terrace(0.6, -1.1, 4.2, 3.2, 0.14);
  terrace(6.6, -5.4, 4.8, 3.6, 0.2);
})();

const waterMat = new THREE.ShaderMaterial({
  transparent: true, uniforms: { uTime: { value: 0 }, uNight: { value: 0 } },
  vertexShader: `
    uniform float uTime; varying vec2 vUv; varying float vWave;
    void main(){
      vUv = uv; vec3 p = position;
      vWave = sin(p.x*1.8+uTime*1.5)*0.045 + sin(p.y*2.4+uTime*1.15)*0.035;
      p.z += vWave;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
    }`,
  fragmentShader: `
    uniform float uNight; varying vec2 vUv; varying float vWave;
    void main(){
      vec3 day = vec3(0.22,0.50,0.62); vec3 night = vec3(0.06,0.12,0.24);
      vec3 col = mix(day, night, uNight);
      col += vec3(0.15,0.22,0.22) * vWave * 4.0;
      float spec = pow(max(vWave*5.0,0.0), 4.0);
      col += vec3(0.75,0.85,0.9) * spec * mix(0.7, 0.25, uNight);
      gl_FragColor = vec4(col, 0.86);
    }`
});

/* -------------------- day / night -------------------- */
let night = 0, nightGoal = 0, autoCycle = false;
const todEl = document.getElementById('tod');
const labels = [
  [0.00, '正午 · 海风清亮'],
  [0.18, '午后 · 黄金时刻'],
  [0.38, '黄昏 · 屋顶镀铜'],
  [0.55, '蓝调时刻'],
  [0.70, '入夜 · 灯火次第'],
  [0.88, '深夜 · 港湾沉静']
];
function todLabel(n) {
  let s = labels[0][1];
  for (const [t, l] of labels) if (n >= t) s = l;
  return s;
}

function setNight(n) {
  skyMat.uniforms.uNight.value = n;
  waterMat.uniforms.uNight.value = n;
  const dayFog = new THREE.Color(0x9ec9e0);
  const nightFog = new THREE.Color(0x0b1020);
  scene.fog.color.lerpColors(dayFog, nightFog, n);
  scene.fog.density = 0.012 + n * 0.01;
  renderer.toneMappingExposure = 1.08 - n * 0.18;
  hemi.intensity = 0.78 - n * 0.45;
  hemi.color.set(n > 0.5 ? 0x6a86c8 : 0xc5e0ff);
  sunLight.intensity = 1.38 * (1 - n);
  sunLight.color.set(n < 0.45 ? 0xfff1d0 : 0xffb070);
  moonLight.intensity = 0.55 * n;
  winMat.emissiveIntensity = n * 1.35;
  lampMat.emissiveIntensity = 0.15 + n * 1.8;
  stars.material.opacity = Math.max(0, (n - 0.45) * 1.8);
  pointLights.forEach((l, i) => { l.intensity = n * (i === 3 ? 2.4 : 1.15); });
  const sa = (1 - n) * Math.PI * 0.72 + 0.2;
  sun.position.set(Math.cos(sa) * 28, Math.sin(sa) * 20 + 2, 10);
  sunLight.position.copy(sun.position);
  const ma = n * Math.PI * 0.7 + 0.3;
  moon.position.set(-Math.cos(ma) * 24, Math.sin(ma) * 16 + 2, -8);
  moonLight.position.copy(moon.position);
  sun.material.emissiveIntensity = 1.3 * (1 - n);
  moon.material.emissiveIntensity = 0.25 + n * 0.7;
  if (anim.fireflies) anim.fireflies.pts.material.opacity = Math.max(0, n - 0.55) * 1.6;
  todEl.textContent = todLabel(n);
}

document.getElementById('btnDay').onclick = () => { autoCycle = false; nightGoal = 0; syncBtns(); };
document.getElementById('btnNight').onclick = () => { autoCycle = false; nightGoal = 1; syncBtns(); };
document.getElementById('btnAuto').onclick = () => { autoCycle = !autoCycle; syncBtns(); };
function syncBtns() {
  document.getElementById('btnDay').classList.toggle('active', !autoCycle && nightGoal < 0.5);
  document.getElementById('btnNight').classList.toggle('active', !autoCycle && nightGoal >= 0.5);
  document.getElementById('btnAuto').classList.toggle('active', autoCycle);
}
const spots = {
  plaza: { t: 0.55, p: 1.05, r: 11.5, look: new THREE.Vector3(0.2, 1.2, 2.3) },
  harbor: { t: 2.35, p: 1.05, r: 10.5, look: new THREE.Vector3(-7.2, 0.6, 6.0) },
  mill: { t: 0.15, p: 1.0, r: 9.5, look: new THREE.Vector3(8.3, 2.2, 3.5) },
  church: { t: 0.85, p: 1.02, r: 11, look: new THREE.Vector3(6.5, 2.4, -5.5) },
  keep: { t: 0.95, p: 0.95, r: 12, look: new THREE.Vector3(7.6, 2.8, -7.0) },
  home: { t: 0.72, p: 0.98, r: 22.5, look: new THREE.Vector3(0.4, 1.6, 0.2) }
};
function goSpot(id) {
  const s = spots[id];
  sphericalGoal.theta = s.t; sphericalGoal.phi = s.p; sphericalGoal.radius = s.r;
  targetGoal.copy(s.look); userDriving = true; userTimer = 0;
}
document.getElementById('btnReset').onclick = () => goSpot('home');
document.querySelectorAll('[data-spot]').forEach((b) => b.onclick = () => goSpot(b.dataset.spot));

/* -------------------- loop -------------------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (autoCycle) nightGoal = 0.5 + 0.5 * Math.sin(t * 0.08 - 0.4);
  night += (nightGoal - night) * (reduceMotion ? 1 : 1 - Math.pow(0.001, dt));
  setNight(night);

  if (!dragging && !reduceMotion && !userDriving) sphericalGoal.theta += dt * 0.05;
  userTimer += dt;
  if (userTimer > 7) userDriving = false;
  spherical.theta += (sphericalGoal.theta - spherical.theta) * 0.08;
  spherical.phi += (sphericalGoal.phi - spherical.phi) * 0.08;
  spherical.radius += (sphericalGoal.radius - spherical.radius) * 0.08;
  camTarget.lerp(targetGoal, 0.08);
  applyCam();

  waterMat.uniforms.uTime.value = t;
  if (anim.mill) anim.mill.rotation.z = t * 0.45;
  if (anim.wheel) anim.wheel.rotation.z = t * 0.9;
  if (anim.clockMin) {
    anim.clockMin.rotation.z = -t * 0.25;
    anim.clockHour.rotation.z = -t * 0.02;
  }
  anim.flags.forEach((f) => { f.mesh.rotation.y = Math.sin(t * 2.2 + f.phase) * f.amp; });
  anim.trees.forEach((tr) => { tr.g.rotation.z = Math.sin(t * 0.7 + tr.phase) * tr.amp; tr.g.rotation.x = Math.cos(t * 0.55 + tr.phase) * tr.amp * 0.5; });
  anim.clouds.forEach((c) => {
    c.g.position.x += c.s * dt;
    if (c.g.position.x > 22) c.g.position.x = -22;
    c.g.children.forEach((ch, i) => { ch.material.opacity = 0.55 + (1 - night) * 0.2; });
  });
  anim.boats.forEach((b) => {
    b.mesh.position.x = (b.z > 5 ? -7.4 : -8.15) + Math.sin(t * 0.25 + b.phase) * b.amp;
    b.mesh.position.z = b.z + Math.cos(t * 0.18 + b.phase) * 0.12;
    b.mesh.position.y = 0.22 + Math.sin(t * 1.4 + b.phase) * 0.03;
    b.mesh.rotation.z = Math.sin(t * 1.2 + b.phase) * 0.05;
  });
  if (anim.road) {
    anim.people.forEach((p) => {
      p.t = (p.t + dt * p.speed * p.dir + 1) % 1;
      const u = p.t;
      const pt = anim.road.getPointAt(u);
      const look = anim.road.getPointAt((u + 0.012 * p.dir + 1) % 1);
      p.mesh.position.copy(pt);
      p.mesh.position.y += 0.02;
      p.mesh.lookAt(look.x, pt.y + 0.02, look.z);
    });
  }
  if (anim.train) {
    anim.train.t = (anim.train.t + dt * 0.03) % 1;
    const p = anim.train.curve.getPointAt(anim.train.t);
    const p2 = anim.train.curve.getPointAt((anim.train.t + 0.01) % 1);
    anim.train.mesh.position.copy(p);
    anim.train.mesh.lookAt(p2);
  }
  anim.smoke.forEach((s) => {
    s.puffs.forEach((p) => {
      p.t += dt * p.speed;
      const u = p.t % 1;
      p.mesh.position.set(Math.sin(p.t * 2) * 0.05, u * 0.7, Math.cos(p.t * 1.4) * 0.04);
      p.mesh.scale.setScalar(0.6 + u * 1.4);
      p.mesh.material.opacity = (1 - u) * 0.28 * (0.6 + night * 0.5);
    });
  });
  anim.fountain.forEach((d) => {
    const u = (t * 0.9 + d.a) % 1.6;
    d.mesh.position.y = groundH(0.15, 2.35) + 0.85 + Math.sin(u) * 0.35;
    d.mesh.position.x = 0.15 + Math.cos(d.a + t) * d.r * u;
    d.mesh.position.z = 2.35 + Math.sin(d.a + t) * d.r * u;
    d.mesh.material.opacity = 0.7 * (1 - u / 1.6);
  });
  if (anim.waterfall) {
    anim.waterfall.sheets.forEach((s, i) => {
      s.material.opacity = 0.12 + 0.12 * Math.sin(t * 3 + i);
      s.position.y = Math.sin(t * 2 + i) * 0.05;
    });
  }
  if (anim.birds[0]) {
    const B = anim.birds[0];
    B.t += dt;
    B.flock.position.set(Math.cos(B.t * 0.25) * 6, 5.5 + Math.sin(B.t * 0.4) * 0.6, Math.sin(B.t * 0.25) * 5);
    B.flock.children.forEach((b, i) => {
      const a = B.t * 0.25 + i * 0.4;
      b.position.set(Math.cos(a) * (0.4 + i * 0.12), Math.sin(a * 2 + i) * 0.15, Math.sin(a) * 0.3);
    });
  }
  if (anim.fireflies && night > 0.5) {
    const arr = anim.fireflies.pos;
    for (let i = 0; i < anim.fireflies.phase.length; i++) {
      arr[i * 3 + 1] += Math.sin(t * 1.6 + anim.fireflies.phase[i]) * 0.004;
    }
    anim.fireflies.pts.geometry.attributes.position.needsUpdate = true;
  }
  renderer.render(scene, camera);
}
setNight(0);
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
