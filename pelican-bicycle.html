<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;
    background:linear-gradient(#8fd3f4,#eaf8ff 82%,#59626e 82.01%)}
  svg{display:block;width:100vw;height:100vh}
  .cloud{animation:drift linear infinite}
  @keyframes drift{from{transform:translateX(1060px)}to{transform:translateX(-320px)}}
  .rays{animation:spin 70s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .whoosh{animation:whoosh 1.15s ease-out infinite;opacity:0}
  @keyframes whoosh{0%{transform:translateX(70px);opacity:0}25%{opacity:.5}
    100%{transform:translateX(-150px);opacity:0}}
</style>
</head>
<body>

    <stop offset="0" stop-color="#8fd3f4"/><stop offset="1" stop-color="#eaf8ff"/>

  <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">

</g>

<g id="pelicanBack">

  <g id="footF"><path d="M-9,-4 L13,-4 Q21,-2 22,2 L10,7 L-9,6 Z" fill="#d57d27"/></g>
</g>

<!-- 自行车 -->
<g id="bike">

  <circle cx="300" cy="408" r="62" fill="none" stroke="#cdd7e1" stroke-width="3"/>
  <g id="spokesR" stroke="#b9c4d2" stroke-width="2.5">
    <line x1="-58" y1="0" x2="58" y2="0"/><line x1="0" y1="-58" x2="0" y2="58"/>
    <line x1="-41" y1="-41" x2="41" y2="41"/><line x1="-41" y1="41" x2="41" y2="-41"/>
    <circle cx="55" cy="0" r="2.4" fill="#8892a0" stroke="none"/>
  </g>
  <circle cx="300" cy="408" r="7" fill="#8892a0"/>
  <path id="chain" d="M300,398 L455,400 A20,20 0 0 1 455,440 L300,418 A10,10 0 0 1 300,398 Z"
        fill="none" stroke="#4a525e" stroke-width="4" stroke-dasharray="5 4"/>
  <circle cx="300" cy="408" r="10" fill="none" stroke="#566070" stroke-width="4"/>
  <g stroke="#e05555" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="300" y1="408" x2="455" y2="420"/>
    <line x1="300" y1="408" x2="424" y2="316"/>
    <line x1="455" y1="420" x2="417" y2="300"/>
    <line x1="455" y1="420" x2="598" y2="326"/>
    <line x1="423" y1="318" x2="599" y2="323"/>
  </g>
  <line x1="598" y1="326" x2="604" y2="294" stroke="#e05555" stroke-width="12" stroke-linecap="round"/>
  <line x1="417" y1="300" x2="412" y2="284" stroke="#3a3f47" stroke-width="7" stroke-linecap="round"/>
  <path d="M384,286 Q410,272 438,284 Q414,296 386,292 Z" fill="#3a3f47" stroke="#22262b" stroke-width="2"/>
  <circle cx="640" cy="408" r="72" fill="none" stroke="#333a44" stroke-width="11"/>
  <circle cx="640" cy="408" r="62" fill="none" stroke="#cdd7e1" stroke-width="3"/>
  <g id="spokesF" stroke="#b9c4d2" stroke-width="2.5">
    <line x1="-58" y1="0" x2="58" y2="0"/><line x1="0" y1="-58" x2="0" y2="58"/>
    <line x1="-41" y1="-41" x2="41" y2="41"/><line x1="-41" y1="41" x2="41" y2="-41"/>
    <circle cx="55" cy="0" r="2.4" fill="#8892a0" stroke="none"/>
  </g>
  <circle cx="640" cy="408" r="7" fill="#8892a0"/>
  <path d="M598,326 C608,352 624,380 640,408" fill="none" stroke="#e05555" stroke-width="8" stroke-linecap="round"/>
  <path d="M604,294 C598,278 584,272 568,277" fill="none" stroke="#3a3f47" stroke-width="6" stroke-linecap="round"/>
  <circle cx="566" cy="277" r="4.5" fill="#22262b"/>
  <line id="crankArmN" x1="455" y1="420" x2="0" y2="0" stroke="#3a3f47" stroke-width="8" stroke-linecap="round"/>
  <circle cx="455" cy="420" r="20" fill="none" stroke="#566070" stroke-width="5"/>
  <circle cx="455" cy="420" r="5.5" fill="#566070"/>
  <g id="pedalN"><rect x="-12" y="-4" width="24" height="8" rx="2.5" fill="#22262b"/></g>
</g>

<!-- 鹈鹕主体 -->
<g id="pelicanFront">
  <path id="legN" d="" fill="none" stroke="#ef9130" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="footN"><path d="M-9,-4 L13,-4 Q21,-2 22,2 L10,7 L-9,6 Z" fill="#ef9130"/></g>
  <g id="bobG">
    <path d="M352,224 Q304,204 284,218 Q318,224 334,238 Q294,236 280,250 Q318,248 336,258 Q306,262 298,274 Q330,270 354,262 Z"
          fill="#fdfcf7" stroke="#3a3632" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M452,226 C478,220 500,198 508,166" fill="none" stroke="#3a3632" stroke-width="31" stroke-linecap="round"/>
    <path d="M452,226 C478,220 500,198 508,166" fill="none" stroke="#fdfcf7" stroke-width="25" stroke-linecap="round"/>
    <g transform="rotate(-8 405 240)">
      <ellipse cx="405" cy="240" rx="80" ry="56" fill="#fdfcf7" stroke="#3a3632" stroke-width="3.5"/>
      <ellipse cx="398" cy="262" rx="56" ry="27" fill="#ece7d8"/>
    </g>
    <g id="wingG">
      <path d="M436,212 Q454,236 428,260 Q406,280 372,274 Q384,266 390,256 Q376,262 362,268 Q382,252 392,238 Q408,222 436,212 Z"
            fill="#f0e9d8" stroke="#3a3632" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M424,228 Q410,248 388,262" fill="none" stroke="#d8d0ba" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <path id="scarf" d="M468,205 L438,210 L408,203 L380,212" fill="none" stroke="#e84f4f"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="467" cy="205" r="6" fill="#e84f4f" stroke="#b53a3a" stroke-width="2"/>
    <g id="headG">
      <circle cx="516" cy="140" r="23" fill="#fdfcf7" stroke="#3a3632" stroke-width="3.5"/>
      <circle cx="513" cy="157" r="5" fill="#ffd9b0" opacity=".8"/>
      <path d="M532,129 Q600,136 662,165 Q630,176 598,169 Q560,157 532,147 Z"
            fill="#f6a63b" stroke="#3a3632" stroke-width="3" stroke-linejoin="round"/>
      <path d="M534,150 C548,198 608,200 654,171 C622,180 566,180 534,150 Z"
            fill="url(#pouch)" stroke="#3a3632" stroke-width="3" stroke-linejoin="round"/>
      <g id="fish">
        <path d="M592,192 L584,175 L593,182 L599,169 L606,185 Z" fill="#7fbfe8" stroke="#4a90c2" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(-6 516 140)">
        <path d="M492,139 A25,25 0 0 1 541,142 Q517,151 492,139 Z" fill="#3d7bd9" stroke="#3a3632" stroke-width="3" stroke-linejoin="round"/>
        <path d="M502,124 A19,19 0 0 1 532,127" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <ellipse id="eye" cx="527" cy="147" rx="4.6" ry="4.6" fill="#2b2b2b"/>
      <circle cx="528.7" cy="145.3" r="1.5" fill="#fff"/>
    </g>
  </g>

<text x="946" y="528" text-anchor="end" font-family="system-ui,sans-serif" font-size="13"
      fill="rgba(40,60,80,.45)">SVG · 鹈鹕骑行 2D 动画</text>
</svg>

<script>
const $=id=>document.getElementById(id);
const BB=[455,420],HIPN=[432,288],HIPF=[424,284],L=86,PED=34;
const SPEED=150,RW=72,GEAR=1/1.7,W=960;
let wheel=0,crank=0,dist=0,last=performance.now();
const wrap=(x,m)=>((x%m)+m)%m;

// 两段式逆运动学：髋固定，脚落在踏板圆上，膝盖取朝前的一支
function leg(h,f){
  const dx=f[0]-h[0],dy=f[1]-h[1],d=Math.hypot(dx,dy)||.001;
  const dc=Math.min(d,2*L-.5),ux=dx/d,uy=dy/d;
  const fp=[h[0]+ux*dc,h[1]+uy*dc];
  const a=dc/2,hh=Math.sqrt(Math.max(0,L*L-a*a));
  const k1=[h[0]+ux*a-uy*hh,h[1]+uy*a+ux*hh],k2=[h[0]+ux*a+uy*hh,h[1]+uy*a-ux*hh];
  const k=k1[0]>k2[0]?k1:k2;
  return {d:`M${h[0].toFixed(1)},${h[1].toFixed(1)} L${k[0].toFixed(1)},${k[1].toFixed(1)} L${fp[0].toFixed(1)},${fp[1].toFixed(1)}`,f:fp};
}

function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  wheel+=SPEED/RW*dt;crank+=SPEED/RW*GEAR*dt;dist+=SPEED*dt;
  const wdeg=wheel*180/Math.PI,cdeg=crank*180/Math.PI,a=crank;
  $('spokesF').setAttribute('transform',`translate(640,408) rotate(${wdeg.toFixed(2)})`);
  $('spokesR').setAttribute('transform',`translate(300,408) rotate(${wdeg.toFixed(2)})`);
  const pF=[BB[0]+PED*Math.cos(a),BB[1]+PED*Math.sin(a)],
        pB=[BB[0]-PED*Math.cos(a),BB[1]-PED*Math.sin(a)];
  $('crankArmN').setAttribute('x2',pF[0]);$('crankArmN').setAttribute('y2',pF[1]);
  $('crankArmF').setAttribute('x2',pB[0]);$('crankArmF').setAttribute('y2',pB[1]);
  $('pedalN').setAttribute('transform',`translate(${pF[0].toFixed(1)},${pF[1].toFixed(1)}) rotate(${(-cdeg).toFixed(2)})`);
  $('pedalF').setAttribute('transform',`translate(${pB[0].toFixed(1)},${pB[1].toFixed(1)}) rotate(${(-cdeg).toFixed(2)})`);
  const bob=Math.sin(crank*2+.6)*3,tilt=Math.sin(crank*2+.6)*1.2;
  $('bobG').setAttribute('transform',`translate(0 ${bob.toFixed(2)}) rotate(${tilt.toFixed(2)} 405 260)`);
  $('headG').setAttribute('transform',`rotate(${(Math.sin(crank*2+1.2)*2.4).toFixed(2)} 512 168)`);
  $('wingG').setAttribute('transform',`rotate(${(Math.sin(crank*2+.3)*3.5).toFixed(2)} 432 224)`);
  const hipN=[HIPN[0],HIPN[1]+bob],hipF=[HIPF[0],HIPF[1]+bob];
  const ln=leg(hipN,pF),lf=leg(hipF,pB);
  $('legN').setAttribute('d',ln.d);
  $('footN').setAttribute('transform',`translate(${ln.f[0].toFixed(1)},${ln.f[1].toFixed(1)})`);
  $('legF').setAttribute('d',lf.d);
  $('footF').setAttribute('transform',`translate(${lf.f[0].toFixed(1)},${lf.f[1].toFixed(1)})`);
  let sp='M468,205';
  const bx=[444,420,396,374],by=[209,206,210,206];
  for(let i=0;i<4;i++)
    sp+=` L${bx[i]},${(by[i]+Math.sin(t/1000*5+i*1.1)*(2+1.4*(i+1))).toFixed(1)}`;
  $('scarf').setAttribute('d',sp);
  $('fish').setAttribute('transform',`rotate(${(Math.sin(t/1000*7)*12).toFixed(1)} 592 192)`);
  $('chain').setAttribute('stroke-dashoffset',(-crank*20%9).toFixed(2));
  $('hillsFar').setAttribute('transform',`translate(${-wrap(dist*.2,W)},0)`);
  $('hillsNear').setAttribute('transform',`translate(${-wrap(dist*.35,W)},0)`);
  $('midL').setAttribute('transform',`translate(${-wrap(dist*.55,W)},0)`);
  $('dashL').setAttribute('transform',`translate(${-wrap(dist,W)},0)`);
  $('roadL').setAttribute('transform',`translate(${-wrap(dist,W)},0)`);
  $('eye').setAttribute('ry',(t/1000%4.3<.13)?.7:4.6);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
