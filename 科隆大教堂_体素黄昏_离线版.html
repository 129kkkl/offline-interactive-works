<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171322">
  <meta name="description" content="可离线探索的 Three.js 体素科隆大教堂黄昏场景">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src data:; media-src data: blob:; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>科隆大教堂 · 体素黄昏圣境</title>
  <style>:root {
  color-scheme: dark;
  --ink: #f3ead8;
  --muted: rgba(235, 226, 211, 0.64);
  --gold: #d7b878;
  --gold-bright: #f2d79d;
  --panel: rgba(18, 15, 27, 0.68);
  --line: rgba(232, 213, 177, 0.24);
  --shadow: rgba(4, 3, 9, 0.62);
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #161220;
  color: var(--ink);
  font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
}

button { font: inherit; }

#app, #scene, #scene canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#scene canvas {
  display: block;
  outline: none;
  touch-action: none;
}

#app::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(7, 6, 12, .56) 0%, transparent 29%, transparent 72%, rgba(8, 6, 13, .34) 100%),
    linear-gradient(0deg, rgba(6, 5, 10, .54) 0%, transparent 28%, transparent 74%, rgba(10, 7, 17, .28) 100%);
}

#app::after {
  content: "";
  position: absolute;
  inset: 14px;
  z-index: 5;
  pointer-events: none;
  border: 1px solid rgba(234, 217, 185, .11);
  box-shadow: inset 0 0 80px rgba(10, 7, 16, .08);
}

.hero {
  position: absolute;
  z-index: 6;
  top: clamp(32px, 7vh, 80px);
  left: clamp(28px, 5.2vw, 88px);
  width: min(420px, 34vw);
  pointer-events: none;
  filter: drop-shadow(0 6px 16px var(--shadow));
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 17px;
  color: var(--gold-bright);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .24em;
}

.eyebrow-mark {
  width: 6px;
  height: 24px;
  border: 1px solid currentColor;
  border-radius: 5px 5px 0 0;
  clip-path: polygon(50% 0, 100% 36%, 100% 100%, 0 100%, 0 36%);
}

.hero h1 {
  margin: 0;
  font-family: Georgia, "STSong", "SimSun", serif;
  font-size: clamp(38px, 5vw, 74px);
  font-weight: 500;
  line-height: .98;
  letter-spacing: .035em;
  text-shadow: 0 3px 22px rgba(0, 0, 0, .62);
}

.hero h1 span {
  color: var(--gold-bright);
  font-size: .6em;
  letter-spacing: .17em;
}

.hero p {
  max-width: 360px;
  margin: 22px 0 16px;
  color: rgba(244, 238, 226, .72);
  font-size: 13px;
  line-height: 1.8;
  letter-spacing: .08em;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.hero-meta span {
  padding: 6px 9px;
  border: 1px solid var(--line);
  background: rgba(21, 17, 28, .38);
  color: rgba(241, 231, 212, .69);
  font-size: 10px;
  letter-spacing: .13em;
  backdrop-filter: blur(5px);
}

.hero-meta b { color: var(--gold-bright); font-weight: 600; }

.view-nav {
  position: absolute;
  z-index: 7;
  top: 50%;
  right: clamp(25px, 4.5vw, 74px);
  width: 216px;
  transform: translateY(-50%);
  padding: 13px 0 11px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.nav-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 0 0 12px;
  padding: 0 8px 9px;
  border-bottom: 1px solid rgba(235, 215, 180, .12);
}

.nav-title span {
  color: var(--gold-bright);
  font-family: Georgia, "SimSun", serif;
  font-size: 13px;
  letter-spacing: .2em;
}

.nav-title small {
  color: rgba(237, 224, 201, .35);
  font-size: 7px;
  letter-spacing: .15em;
}

.view-nav button {
  position: relative;
  display: grid;
  grid-template-columns: 28px 1fr;
  grid-template-rows: 18px 15px;
  width: 100%;
  min-height: 50px;
  padding: 8px 10px;
  border: 0;
  border-left: 1px solid transparent;
  background: transparent;
  color: rgba(243, 234, 218, .56);
  text-align: left;
  cursor: pointer;
  transition: color .22s ease, background .22s ease, border-color .22s ease, transform .22s ease;
}

.view-nav button::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 9px;
  width: 4px;
  height: 4px;
  border-top: 1px solid currentColor;
  border-right: 1px solid currentColor;
  transform: translateY(-50%) rotate(45deg);
  opacity: .42;
}

.view-nav button:hover,
.view-nav button:focus-visible {
  color: #fff8e9;
  background: linear-gradient(90deg, rgba(222, 190, 129, .11), transparent);
  outline: none;
  transform: translateX(-3px);
}

.view-nav button.active {
  border-left-color: var(--gold-bright);
  background: linear-gradient(90deg, rgba(222, 190, 129, .14), transparent 76%);
  color: #fff5e2;
}

.view-nav button > span {
  grid-row: 1 / 3;
  align-self: center;
  color: rgba(226, 198, 143, .45);
  font: italic 11px/1 Georgia, serif;
}

.view-nav button.active > span { color: var(--gold-bright); }

.view-nav button b {
  font-family: Georgia, "STSong", "SimSun", serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .14em;
}

.view-nav button small {
  color: rgba(233, 223, 207, .4);
  font-size: 9px;
  letter-spacing: .08em;
}

.controls {
  position: absolute;
  z-index: 7;
  right: clamp(28px, 4.5vw, 74px);
  bottom: clamp(28px, 5.5vh, 62px);
  display: flex;
  gap: 6px;
}

.controls button {
  min-height: 34px;
  padding: 0 11px;
  border: 1px solid rgba(232, 213, 177, .22);
  background: rgba(17, 14, 24, .58);
  color: rgba(242, 233, 216, .67);
  font-size: 10px;
  letter-spacing: .08em;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: .2s ease;
}

.controls button:hover,
.controls button:focus-visible {
  border-color: rgba(242, 215, 161, .56);
  color: #fff7e8;
  outline: none;
}

.status-dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin: 0 6px 1px 0;
  border-radius: 50%;
  background: #edc476;
  box-shadow: 0 0 8px #edc476;
}

button[aria-pressed="false"] .status-dot {
  background: rgba(241, 233, 216, .35);
  box-shadow: none;
}

.hint {
  position: absolute;
  z-index: 6;
  left: clamp(28px, 5.2vw, 88px);
  bottom: clamp(31px, 6vh, 67px);
  display: flex;
  align-items: center;
  gap: 9px;
  color: rgba(239, 230, 214, .5);
  font-size: 10px;
  letter-spacing: .12em;
  pointer-events: none;
}

.mouse-icon {
  position: relative;
  width: 14px;
  height: 20px;
  border: 1px solid rgba(239, 220, 183, .55);
  border-radius: 8px;
}

.mouse-icon::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 50%;
  width: 1px;
  height: 5px;
  background: var(--gold-bright);
}

.compass {
  position: absolute;
  z-index: 6;
  left: 50%;
  top: 34px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateX(-50%);
  color: rgba(243, 223, 183, .6);
  font: 10px/1 Georgia, serif;
  letter-spacing: .2em;
  pointer-events: none;
}

.compass i {
  width: 1px;
  height: 15px;
  margin: 4px 0 3px;
  background: linear-gradient(var(--gold-bright), transparent);
}

.compass small { font: 7px/1 "Segoe UI", sans-serif; opacity: .5; }

.frame-corner {
  position: absolute;
  z-index: 6;
  width: 33px;
  height: 33px;
  pointer-events: none;
}

.frame-tl { top: 14px; left: 14px; border-top: 2px solid rgba(237, 214, 169, .44); border-left: 2px solid rgba(237, 214, 169, .44); }
.frame-br { right: 14px; bottom: 14px; border-right: 2px solid rgba(237, 214, 169, .44); border-bottom: 2px solid rgba(237, 214, 169, .44); }

#loading {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-content: center;
  justify-items: center;
  background:
    radial-gradient(circle at 50% 48%, rgba(80, 58, 91, .28), transparent 32%),
    linear-gradient(#22192e, #14101c);
  text-align: center;
  transition: opacity .8s ease, visibility .8s ease;
}

.is-ready #loading { opacity: 0; visibility: hidden; }

.loader-mark {
  position: relative;
  width: 62px;
  height: 76px;
  margin-bottom: 24px;
}

.loader-mark i {
  position: absolute;
  bottom: 0;
  width: 24px;
  height: 64px;
  border: 1px solid var(--gold);
  clip-path: polygon(50% 0, 100% 34%, 100% 100%, 0 100%, 0 34%);
  background: linear-gradient(rgba(219, 184, 118, .18), transparent);
  animation: towerPulse 1.5s ease-in-out infinite alternate;
}

.loader-mark i:first-child { left: 4px; }
.loader-mark i:last-child { right: 4px; animation-delay: -.7s; }

@keyframes towerPulse { to { filter: drop-shadow(0 0 10px rgba(239, 202, 133, .65)); transform: translateY(-3px); } }

#loading p {
  margin: 0 0 5px;
  font-family: Georgia, "STSong", serif;
  font-size: 18px;
  letter-spacing: .28em;
}

#loading small { color: rgba(232, 211, 172, .42); font-size: 8px; letter-spacing: .34em; }

.loader-line {
  width: 150px;
  height: 1px;
  margin-top: 18px;
  overflow: hidden;
  background: rgba(239, 219, 179, .16);
}

.loader-line span {
  display: block;
  width: 42%;
  height: 100%;
  background: var(--gold-bright);
  box-shadow: 0 0 9px var(--gold);
  animation: loadSweep 1.3s ease-in-out infinite;
}

@keyframes loadSweep { from { transform: translateX(-110%); } to { transform: translateX(350%); } }

#offline-error {
  position: fixed;
  z-index: 80;
  top: 50%;
  left: 50%;
  width: min(420px, calc(100vw - 42px));
  padding: 28px;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(241, 208, 149, .45);
  background: #1b1624;
  box-shadow: 0 22px 80px rgba(0, 0, 0, .55);
  text-align: center;
}

#offline-error strong { color: var(--gold-bright); font: 22px Georgia, serif; }
#offline-error p { margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

@media (max-width: 900px) {
  .hero { top: 30px; left: 28px; width: 56vw; }
  .hero h1 { font-size: clamp(34px, 8vw, 58px); }
  .hero p { display: none; }
  .hero-meta { margin-top: 15px; }
  .view-nav { top: auto; right: 20px; bottom: 76px; width: 182px; transform: none; }
  .view-nav button { min-height: 43px; grid-template-rows: 16px 13px; }
  .nav-title, .view-nav button small { display: none; }
  .view-nav button { grid-template-columns: 26px 1fr; grid-template-rows: 1fr; }
  .view-nav button > span { grid-row: auto; }
  .controls { right: 20px; bottom: 27px; }
  .hint { left: 28px; bottom: 34px; max-width: 42vw; line-height: 1.5; }
}

@media (max-width: 620px) {
  #app::after { inset: 8px; }
  .frame-tl { top: 8px; left: 8px; }
  .frame-br { right: 8px; bottom: 8px; }
  .hero { top: 24px; left: 22px; width: calc(100vw - 44px); }
  .eyebrow { margin-bottom: 11px; font-size: 8px; }
  .hero h1 { font-size: 39px; }
  .hero-meta span:nth-child(n+2) { display: none; }
  .view-nav {
    left: 16px;
    right: 16px;
    bottom: 68px;
    width: auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 0;
    border: 1px solid rgba(232, 213, 177, .18);
    background: rgba(13, 11, 19, .58);
    backdrop-filter: blur(8px);
  }
  .view-nav button {
    display: flex;
    min-height: 48px;
    align-items: center;
    justify-content: center;
    padding: 5px 2px;
    border-left: 0;
    border-top: 1px solid transparent;
    text-align: center;
  }
  .view-nav button::after, .view-nav button > span { display: none; }
  .view-nav button b { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; font-size: 9px; letter-spacing: .04em; }
  .view-nav button.active { border-top-color: var(--gold-bright); background: rgba(223, 188, 121, .12); }
  .controls { left: 16px; right: 16px; bottom: 17px; justify-content: center; }
  .controls button { flex: 1; padding: 0 6px; font-size: 9px; }
  #fullscreen-btn { display: none; }
  .hint, .compass { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
  <main id="app" aria-label="科隆大教堂三维体素场景">
    <div id="scene" aria-hidden="true"></div>

    <section class="hero" aria-labelledby="scene-title">
      <div class="eyebrow"><span class="eyebrow-mark"></span> KÖLNER DOM · VOXEL STUDY</div>
      <h1 id="scene-title">科隆大教堂<br><span>黄昏圣境</span></h1>
      <p>按真实尺度重建镂空双塔、国王廊、五廊中殿、双层飞扶壁与环形后殿。</p>
      <div class="hero-meta">
        <span><b id="voxel-count">—</b> 方块</span>
        <span>完全离线</span>
        <span>实时光影</span>
      </div>
    </section>

    <nav class="view-nav" aria-label="建筑视角">
      <div class="nav-title"><span>建筑巡礼</span><small>ARCHITECTURAL TOUR</small></div>
      <button type="button" data-view="west" class="active"><span>01</span><b>西立面</b><small>双塔与三重门廊</small></button>
      <button type="button" data-view="nave"><span>02</span><b>五廊中殿</b><small>双层飞扶壁</small></button>
      <button type="button" data-view="rose"><span>03</span><b>南耳堂</b><small>三色玫瑰窗</small></button>
      <button type="button" data-view="apse"><span>04</span><b>环形后殿</b><small>辐射小礼拜堂</small></button>
      <button type="button" data-view="aerial"><span>05</span><b>云上全景</b><small>悬浮岛与广场</small></button>
    </nav>

    <section class="controls" aria-label="场景控制">
      <button type="button" id="tour-toggle" aria-pressed="true"><span class="status-dot"></span> 自动巡礼</button>
      <button type="button" id="fog-toggle" aria-pressed="true">薄雾</button>
      <button type="button" id="night-toggle" aria-pressed="false">夜色</button>
      <button type="button" id="reset-view">复位</button>
      <button type="button" id="fullscreen-btn" aria-pressed="false">全屏</button>
    </section>

    <div class="hint"><span class="mouse-icon" aria-hidden="true"></span>拖拽环绕 · 滚轮缩放 · 点击右侧切换视角</div>
    <div class="compass" aria-hidden="true"><span>N</span><i></i><small>WEST FAÇADE</small></div>
    <div class="frame-corner frame-tl"></div><div class="frame-corner frame-br"></div>

    <div id="loading" role="status" aria-live="polite">
      <div class="loader-mark"><i></i><i></i></div>
      <p>正在砌筑圣殿</p>
      <small>ASSEMBLING VOXELS</small>
      <div class="loader-line"><span></span></div>
    </div>

    <div id="offline-error" hidden role="alert">
      <strong>场景未能启动</strong>
      <p>请确认浏览器已开启硬件加速并支持 WebGL 2，然后重新打开此文件。</p>
    </div>
